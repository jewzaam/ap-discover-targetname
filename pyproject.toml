[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-discover-targetname"
version = "0.1.0"
description = "Append target names to untargeted light frames using the nearest reference target by RA/DEC"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Naveen Malik"}
]
keywords = ["astrophotography", "fits", "file-organization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # pinned: reproducible installs of the header parser this tool renames from
    "ap-common @ git+https://github.com/jewzaam/ap-common.git@31b6719aeba479002b07acb50bf9fd2025eb4e4a",
]

[project.scripts]
ap-discover-targetname = "ap_discover_targetname.discover_targetname:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    # write real FITS fixtures for the header contract test
    "astropy>=6.0.0",
    "numpy>=2.5",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.11",
    "xenon>=0.9",
    "mutmut>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ap_discover_targetname*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
ignore_missing_imports = true
